<div class="outils-texte" role="toolbar" aria-label="Mise en forme">
  <button type="button" data-format="gras" title="Mettre en gras les mots sélectionnés"><b>G</b></button>
  <button type="button" data-format="italique" title="Mettre en italique les mots sélectionnés"><i>I</i></button>
  <button type="button" data-format="souligne" title="Souligner les mots sélectionnés"><u>S</u></button>
  <small class="aide">Sélectionnez des mots, puis touchez G (gras), I (italique) ou S (souligné) ; G puis I pour le gras italique. Ici, ils s'affichent entre ** (gras), * (italique) ou __ (souligné) ; sur le courrier, ils sont imprimés dans le bon style.</small>
</div>
