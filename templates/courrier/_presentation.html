{# Langue, ligne d'adresse, police et taille (décisions du 18/11/2026). Variables : v (valeurs). #}
<fieldset class="choix-ligne" id="choix-langue"><legend>Langue de rédaction</legend>
  {% for val, lib in langues %}<label><input type="radio" name="langue" value="{{ val }}" {% if v.langue == val or not v.langue and val == "fr" %}checked{% endif %}> {{ lib }}</label>{% endfor %}
</fieldset>
<label class="champ"><span>Ligne d'adresse</span><textarea name="adresse" rows="2" maxlength="500" data-clavier placeholder="Laissez vide en français : le site écrit « À Monsieur le … », « Au Capitaine … » ou « À la Capitaine … » selon les destinataires.">{{ v.adresse|default:'' }}</textarea>
  <small class="aide">En goun, la ligne commence par « Hlan » : écrivez la suite (une personne, un bureau, une région, toute la communauté…).</small></label>
<div class="date-heure">
  <label class="champ"><span>Police</span><select name="police" id="choix-police">
    {% for val, lib in polices %}<option value="{{ val }}" {% if v.police == val %}selected{% endif %}>{{ lib }}</option>{% endfor %}</select></label>
  <label class="champ"><span>Taille du texte</span><select name="taille" id="choix-taille">
    {% for t in tailles %}<option value="{{ t }}" {% if v.taille|stringformat:"s" == t|stringformat:"s" or not v.taille and t == 12 %}selected{% endif %}>{{ t }} points</option>{% endfor %}</select></label>
</div>
<label class="option-ligne"><input type="checkbox" name="une_page" value="1" {% if v.une_page %}checked{% endif %}> Tenir sur une page (le site resserre le texte, jusqu'à 9 points)</label>
{{ police_par_langue|json_script:"police-par-langue" }}
<script>
  (function () {
    var form = document.currentScript.closest('form');
    var parLangue = JSON.parse(document.getElementById('police-par-langue').textContent);
    var police = form.querySelector('#choix-police'), taille = form.querySelector('#choix-taille');
    var adresse = form.querySelector('textarea[name="adresse"]'), texte = form.querySelector('textarea[name="texte"]');
    var policeChoisie = {% if v.police %}true{% else %}false{% endif %};
    var FAMILLES = {liberation_serif: 'CourrierLiberationSerif', liberation_sans: 'CourrierLiberationSans', charis: 'CourrierCharis', gentium: 'CourrierGentium', noto_serif: 'CourrierNotoSerif'};
    function langue() { var r = form.querySelector('input[name="langue"]:checked'); return r ? r.value : 'fr'; }
    function apercu() {
      // Le texte s'affiche dans la police et la taille choisies : on voit avant d'envoyer.
      [texte, adresse].forEach(function (z) {
        if (!z) return;
        z.style.fontFamily = (FAMILLES[police.value] || 'serif') + ', serif';
        z.style.fontSize = (parseInt(taille.value, 10) * 1.33) + 'px';
      });
    }
    function majLangue() {
      var l = langue();
      var clavier = form.querySelector('.clavier');
      if (clavier) clavier.hidden = l !== 'gun';
      if (!policeChoisie && parLangue[l]) police.value = parLangue[l];
      if (l === 'gun' && !adresse.value.trim()) adresse.value = 'Hlan ';
      if (l === 'fr' && adresse.value.trim().toLowerCase() === 'hlan') adresse.value = '';
      apercu();
    }
    police.addEventListener('change', function () { policeChoisie = true; apercu(); });
    taille.addEventListener('change', apercu);
    form.querySelectorAll('input[name="langue"]').forEach(function (r) { r.addEventListener('change', majLangue); });
    // Le clavier goun est plus bas dans la page : on attend qu'elle soit entièrement chargée.
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', majLangue);
    else majLangue();
  })();
</script>
